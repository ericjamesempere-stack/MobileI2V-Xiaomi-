plugins {
    id 'com.android.library' version '8.5.2'
}
android {
    namespace 'com.mobilei2v.encoder'
    compileSdk 35
    defaultConfig { minSdk 24 }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric's Android FileDescriptor bridge on Java 17.
            jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
            testLogging { exceptionFormat = 'full' }
        }
    }
    // Reuse the existing native MNN Java sources in the Android plugin AAR.
    // Without this, MP4Exporter cannot resolve KarmaMnnBridge at compile time.
    sourceSets {
        main.java.srcDirs += ['../mnnarm64/src']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    compileOnly 'org.godotengine:godot:4.5.2.stable'
    compileOnly 'androidx.annotation:annotation:1.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Explicit task ordering prevents Gradle from reading shared Android plugin
// outputs before their producer tasks have completed.
afterEvaluate {
    tasks.matching { it.name == 'extractDebugAnnotations' }.configureEach {
        dependsOn tasks.matching {
            it.name in ['writeDebugAarMetadata', 'javaPreCompileDebug', 'mergeDebugJavaResource']
        }
    }
}
