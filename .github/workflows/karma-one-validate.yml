name: Validate KARMA ONE Godot scripts

on:
  push:
    branches:
      - karma/storyboard-story-sequence-20261113
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'scenes/**'
      - 'project.godot'
      - '.github/workflows/karma-one-validate.yml'
  workflow_dispatch:

jobs:
  validate-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify ARM64 Android export preset before build
        run: |
          python3 - <<'PY'
          import configparser
          from pathlib import Path
          p = Path("export_presets.cfg")
          assert p.is_file(), "Missing Android export preset"
          c = configparser.ConfigParser(interpolation=None)
          c.read(p)
          assert c.get("preset.0", "platform").strip('"') == "Android", "Android preset missing"
          opts = c["preset.0.options"]
          assert opts.get("architectures/arm64-v8a") == "true", "ARM64 export disabled"
          assert opts.get("architectures/armeabi-v7a") == "false", "Unexpected ARMv7 export"
          print("PASS: Android ARM64 export configuration")
          PY
      - name: Download Godot 4.5.2 headless-compatible binary
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.5.2-stable_linux.x86_64
      - name: Confirm Godot installation
        run: /tmp/Godot_v4.5.2-stable_linux.x86_64 --version
      - name: Import Godot project
        run: |
          set -euo pipefail
          /tmp/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-import.log; then exit 1; fi
      - name: Parse and load project scripts
        run: |
          set -euo pipefail
          timeout 120s /tmp/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/validate_karma_one.gd 2>&1 | tee /tmp/godot-validate.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|INVALID SCRIPT|FAILED:|INVALID MAIN SCENE' /tmp/godot-validate.log; then exit 1; fi
      - name: Smoke-test application startup after successful validation
        run: |
          set -euo pipefail
          timeout 45s /tmp/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --quit-after 20 2>&1 | tee /tmp/godot-startup.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:|FATAL:' /tmp/godot-startup.log; then exit 1; fi
          echo "PASS: Godot project startup"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karma-one-godot-diagnostics
          path: |
            /tmp/godot-import.log
            /tmp/godot-validate.log
            /tmp/godot-startup.log
          if-no-files-found: warn
          retention-days: 7
