name: Verify ComfyUI Pose Bridge

on:
  push:
    branches:
      - karma/storyboard-story-sequence-20261113
    paths:
      - 'backend/comfyui_pose_bridge.py'
      - 'backend/test_comfyui_pose_bridge.py'
      - '.github/workflows/verify-comfyui-pose-bridge.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bridge test dependencies
        run: python -m pip install fastapi pillow requests pydantic
      - name: Validate bridge syntax
        run: python -m py_compile backend/comfyui_pose_bridge.py backend/test_comfyui_pose_bridge.py
      - name: Test privacy and configuration failures
        run: python -m unittest backend.test_comfyui_pose_bridge -v
