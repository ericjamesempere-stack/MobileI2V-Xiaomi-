name: KARMA ONE - Build real MNN Android ARM64 libraries (NO APK)
on:
  push:
    branches: [karma/step12-consolidation-20261118]
    paths:
      - '.github/workflows/build-mnn-arm64.yml'
      - 'native/mnnarm64/src/karma_sd_scheduler.hpp'
      - 'native/mnnarm64/src/karma_mnn_jni.cpp'
      - 'native/mnnarm64/src/KarmaMnnBridge.java'
      - 'native/mnnarm64/src/KarmaSdInference.java'
      - 'tests/test_mnn_ddim_scheduler.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-native-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate DDIM scheduler numerically on host
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I native/mnnarm64/src tests/test_mnn_ddim_scheduler.cpp -o /tmp/karma-ddim-test
          /tmp/karma-ddim-test
      - name: Compile Android Java inference loop (no APK)
        run: |
          set -euo pipefail
          ANDROID_JAR="$(find "${ANDROID_HOME:-/opt/android-sdk}" -path '*/platforms/android-*/android.jar' -print | sort -V | tail -n 1)"
          test -f "$ANDROID_JAR"
          mkdir -p /tmp/karma-java-classes
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/karma-java-classes \
            native/mnnarm64/src/KarmaMnnBridge.java native/mnnarm64/src/KarmaSdInference.java
          echo KARMA_SD_JAVA_LOOP_COMPILES_OK
      - name: Setup Android NDK r27c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Checkout pinned upstream MNN source
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/alibaba/MNN.git /tmp/MNN
          git -C /tmp/MNN checkout 40ad7e340cdf5cb29fe9d5f1f9eec794adbaef6d
          git -C /tmp/MNN rev-parse HEAD | tee mnn-upstream-sha.txt
      - name: Build actual MNN arm64-v8a CPU runtime
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cmake -S /tmp/MNN -B /tmp/mnn-android-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DMNN_BUILD_TEST=OFF -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_CONVERTER=OFF -DMNN_BUILD_TRAIN=OFF \
            -DMNN_OPENCL=OFF -DMNN_VULKAN=OFF \
            -DMNN_ARM82=ON -DMNN_LOW_MEMORY=ON -DMNN_SEP_BUILD=OFF \
            -DMNN_BUILD_DIFFUSION=OFF -DMNN_BUILD_OPENCV=OFF
          cmake --build /tmp/mnn-android-build --target MNN --parallel 2
          mkdir -p native/mnnarm64/prebuilt/include native/mnnarm64/prebuilt/lib/arm64-v8a
          cp -R /tmp/MNN/include/MNN native/mnnarm64/prebuilt/include/
          MNN_SO="$(find /tmp/mnn-android-build -type f -name libMNN.so | head -n 1)"
          test -n "$MNN_SO"
          cp "$MNN_SO" native/mnnarm64/prebuilt/lib/arm64-v8a/libMNN.so
      - name: Build actual KARMA JNI ARM64 library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cmake -S native/mnnarm64 -B /tmp/karma-mnn-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON
          cmake --build /tmp/karma-mnn-build --parallel 2
          test -s /tmp/karma-mnn-build/libkarma_mnn.so
          mkdir -p mnn-arm64-output
          cp native/mnnarm64/prebuilt/lib/arm64-v8a/libMNN.so mnn-arm64-output/
          cp /tmp/karma-mnn-build/libkarma_mnn.so mnn-arm64-output/
          cp mnn-upstream-sha.txt mnn-arm64-output/
          sha256sum mnn-arm64-output/*.so | tee mnn-arm64-output/SHA256SUMS
          file mnn-arm64-output/*.so
          echo KARMA_MNN_ARM64_NATIVE_BUILD_OK
      - name: Publish native binaries (not an APK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: karma-mnn-arm64-native-libs
          path: mnn-arm64-output/
          retention-days: 7
