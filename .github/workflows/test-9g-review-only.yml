name: KARMA ONE 9G — Godot tests only (NO APK)

on:
  push:
    branches:
      - karma/step09g-review-assertion-fix-20261118
    paths:
      - tests/test_reference_review_pipeline.gd
      - scripts/**
      - .github/workflows/test-9g-review-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.5.2 (no Android SDK, no APK)
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Run review and regression checks without GPU or APK
        run: |
          set -euo pipefail
          for test in test_reference_review_pipeline.gd test_friendly_studio.gd test_hf_batch_fallback.gd; do
            echo "::group::$test"
            timeout 45s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script "res://tests/$test" 2>&1 | tee "$test.log"
            if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error' "$test.log"; then exit 1; fi
            case "$test" in
              test_reference_review_pipeline.gd) grep -q 'REFERENCE_IMPORT_SUBJECT_PROMPT_AND_REVIEW_GATE_OK' "$test.log" ;;
              test_friendly_studio.gd) grep -q 'FRIENDLY_STUDIO_NAVIGATION_AND_GUARDS_OK' "$test.log" ;;
              test_hf_batch_fallback.gd) grep -q 'HF_BATCH_FALLBACK_OK' "$test.log" ;;
            esac
            echo "::endgroup::"
          done
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karma-9g-godot-tests-no-apk
          path: '*.gd.log'
          if-no-files-found: ignore
