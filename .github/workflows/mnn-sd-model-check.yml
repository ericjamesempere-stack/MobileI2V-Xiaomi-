name: KARMA ONE - SD model manifest checks (no APK)
on:
  push:
    branches: [karma/step12-consolidation-20261118]
    paths:
      - 'tools/mnn_sd_model_manifest.py'
      - 'tests/test_mnn_sd_model_manifest.py'
      - 'tools/verify_mnn_sd_export.py'
      - 'tools/convert_sd15_to_mnn.sh'
      - 'tests/test_verify_mnn_sd_export.py'
      - '.github/workflows/mnn-sd-model-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-model-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test offline model manifest generation and safety
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_mnn_sd_model_manifest.py -v
          python3 -m unittest discover -s tests -p test_verify_mnn_sd_export.py -v
          python3 -m py_compile tools/mnn_sd_model_manifest.py tools/verify_mnn_sd_export.py
          bash -n tools/convert_sd15_to_mnn.sh
          echo KARMA_MNN_SD_MANIFEST_OK
