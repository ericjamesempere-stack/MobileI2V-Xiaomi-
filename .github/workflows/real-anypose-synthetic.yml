name: Real AnyPose Synthetic Image Test

on:
  push:
    branches:
      - karma/storyboard-story-sequence-20261113
    paths:
      - 'tools/smoke_anypose_synthetic.py'
      - '.github/workflows/real-anypose-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inference client
        run: python -m pip install -q 'gradio_client>=1.0' pillow fastapi
      - name: Run real inference with two synthetic figures
        env:
          MOBILEI2V_TEST_ARTIFACTS: /tmp/mobilei2v_anypose_artifacts
        run: python -m tools.smoke_anypose_synthetic
      - name: Upload synthetic comparison images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anypose-synthetic-comparison
          path: /tmp/mobilei2v_anypose_artifacts/*.png
          if-no-files-found: warn
