name: KARMA ONE - verify MNN ARM64 Android staging (NO APK)
on:
  push:
    branches: [karma/step04-clip-parity-validated-20261119]
    paths:
      - 'tools/stage_mnn_arm64.py'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/verify-mnn-arm64-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stage-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify real APK export pipeline stages native libraries after Gradle extraction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/build-apk.yml').read_text()
          extract = source.index('      - name: Install Android Gradle build template without launching editor')
          stage = source.index('      - name: Stage verified MNN ARM64 JNI libraries in real Android Gradle export')
          signing = source.index('      - name: Preserve debug signing identity for subsequent updates')
          assert extract < stage < signing, 'MNN staging must follow Gradle extraction'
          assert 'python3 tools/stage_mnn_arm64.py /tmp/karma-native-arm64 android/build' in source
          assert 'gh run download 44459460832' in source
          assert 'actions: read' in source
          assert 'cp "native/mnnarm64/src/$source" "android/build/src/main/java/com/mobilei2v/mnn/$source"' in source
          assert 'KARMA_MNN_ANDROID_JAVA_BRIDGE_STAGED_OK' in source
          assert 'KARMA_MNN_APK_NATIVE_AND_JAVA_PACKAGING_OK' in source
          assert 'grep -Fxq "lib/arm64-v8a/$native_lib" apk-entries.txt' in source
          assert "('KarmaMnnBridge', 'KarmaClipEncoder', 'KarmaSdInference')" in source
          print('KARMA_MNN_REAL_EXPORT_STAGE_WIRING_OK')
          PY
      - name: Fetch exact successful ARM64 native artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ericjamesempere-stack/MobileI2V-Xiaomi-'
          mkdir -p /tmp/karma-native
          gh run download 44459460832 --repo "$GITHUB_REPOSITORY" --name karma-mnn-arm64-native-libs --dir /tmp/karma-native
          test -s /tmp/karma-native/libMNN.so
          test -s /tmp/karma-native/libllm.so
          test -s /tmp/karma-native/libkarma_mnn.so
          test -s /tmp/karma-native/SHA256SUMS
          test -s /tmp/karma-native/mnn-upstream-sha.txt
          test -s /tmp/karma-native/mnn-tokenizer-patched-sha256.txt
          grep -Fxq '40ad7e340cdf5cb29fe9d5f1f9eec794adbaef6d' /tmp/karma-native/mnn-upstream-sha.txt
      - name: Verify real AArch64 JNI exports and native dependencies
        run: |
          set -euo pipefail
          readelf -h /tmp/karma-native/libkarma_mnn.so | grep -F 'AArch64'
          readelf -Ws /tmp/karma-native/libkarma_mnn.so > /tmp/karma-mnn-jni-symbols.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          java = Path('native/mnnarm64/src/KarmaMnnBridge.java').read_text()
          cpp = Path('native/mnnarm64/src/karma_mnn_jni.cpp').read_text()
          symbols = Path('/tmp/karma-mnn-jni-symbols.txt').read_text()
          methods = re.findall(r'\b(?:private|public)\s+static\s+native\s+\S+\s+(native\w+)\s*\(', java)
          assert methods, 'No Java native methods detected'
          for method in methods:
              symbol = 'Java_com_mobilei2v_mnn_KarmaMnnBridge_' + method
              assert symbol in cpp, 'JNI source implementation missing: ' + symbol
              assert symbol in symbols, 'ARM64 ELF JNI export missing: ' + symbol
          print('KARMA_MNN_ARM64_JNI_ELF_EXPORTS_OK', len(methods))
          PY
          readelf -d /tmp/karma-native/libkarma_mnn.so | grep NEEDED
          echo KARMA_MNN_ARM64_NATIVE_SYMBOL_CHECK_OK
      - name: Validate Godot Android Gradle layout and stage libraries
        run: |
          set -euo pipefail
          mkdir -p /tmp/karma-android-build
          printf 'plugins { id "com.android.library" }\n' > /tmp/karma-android-build/build.gradle
          python3 tools/stage_mnn_arm64.py /tmp/karma-native /tmp/karma-android-build
          test -s /tmp/karma-android-build/src/main/jniLibs/arm64-v8a/libMNN.so
          test -s /tmp/karma-android-build/src/main/jniLibs/arm64-v8a/libllm.so
          test -s /tmp/karma-android-build/src/main/jniLibs/arm64-v8a/libkarma_mnn.so
          mkdir -p /tmp/karma-android-build/src/main/java/com/mobilei2v/mnn
          cp native/mnnarm64/src/KarmaMnnBridge.java native/mnnarm64/src/KarmaClipEncoder.java native/mnnarm64/src/KarmaSdInference.java /tmp/karma-android-build/src/main/java/com/mobilei2v/mnn/
          ANDROID_JAR="$(find "${ANDROID_HOME:-/opt/android-sdk}" -path '*/platforms/android-*/android.jar' -print | sort -V | tail -n 1)"
          test -s "$ANDROID_JAR"
          mkdir -p /tmp/karma-mnn-java-classes
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/karma-mnn-java-classes /tmp/karma-android-build/src/main/java/com/mobilei2v/mnn/*.java
          test -s /tmp/karma-mnn-java-classes/com/mobilei2v/mnn/KarmaMnnBridge.class
          echo KARMA_MNN_ARM64_ANDROID_STAGING_OK
      - name: Inspect actual Godot Android source template (no APK build)
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 180 -o /tmp/godot-android-templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          tpz = Path('/tmp/godot-android-templates.tpz')
          with zipfile.ZipFile(tpz) as archive:
              candidates = [name for name in archive.namelist() if name.endswith('android_source.zip')]
              assert len(candidates) == 1, 'Expected one official Godot Android Gradle template'
              with archive.open(candidates[0]) as source:
                  import io
                  with zipfile.ZipFile(io.BytesIO(source.read())) as gradle:
                      names = gradle.namelist()
                      build_files = [name for name in names if name.endswith('build.gradle')]
                      assert build_files, 'Missing Gradle build.gradle in official template'
                      prefix = ''
                      for name in build_files:
                          if name.endswith('build/build.gradle'):
                              prefix = name[:-len('build/build.gradle')]
                              break
                      assert any(name.endswith('gradlew') for name in names), 'Missing Gradle wrapper'
                      manifests = [name for name in names if name.endswith('AndroidManifest.xml') or 'manifest' in name.lower()]
                      print('Android manifest candidates:', manifests[:20])
                      assert any(name.endswith('gradle.properties') for name in names), 'Missing Gradle properties'
                      print('Godot template manifest is generated or supplied during Android export; do not require src/main/AndroidManifest.xml in source archive')
                      print('KARMA_GODOT_OFFICIAL_ANDROID_TEMPLATE_LAYOUT_OK')
                      print('Template Gradle build files:', build_files[:12])
                      print('Extraction prefix:', repr(prefix))
          PY
      - name: Stage MNN in extracted official Godot Gradle project (no APK)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          import zipfile
          from pathlib import Path
          root = Path('/tmp/karma-official-android/build')
          with zipfile.ZipFile('/tmp/godot-android-templates.tpz') as outer:
              source_name = next(name for name in outer.namelist() if name.endswith('android_source.zip'))
              with zipfile.ZipFile(io.BytesIO(outer.read(source_name))) as archive:
                  entries = [entry for entry in archive.infolist() if not entry.is_dir()]
                  candidates = [entry for entry in entries if entry.filename.endswith('build.gradle') and not entry.filename.endswith('settings.gradle')]
                  prefix = ''
                  for candidate in candidates:
                      if candidate.filename.endswith('build/build.gradle'):
                          prefix = candidate.filename[:-len('build/build.gradle')]
                          break
                  for entry in entries:
                      name = entry.filename
                      if prefix and not name.startswith(prefix):
                          continue
                      rel = name[len(prefix):]
                      if rel.startswith('android/build/'):
                          rel = rel[len('android/build/'):]
                      elif rel.startswith('build/'):
                          rel = rel[len('build/'):]
                      if not rel or rel.startswith('/') or '..' in Path(rel).parts:
                          continue
                      dest = root / rel
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(archive.read(entry))
          assert (root / 'build.gradle').is_file(), 'Actual Godot Gradle build file not extracted'
          assert (root / 'gradlew').is_file(), 'Actual Godot Gradle wrapper not extracted'
          print('KARMA_GODOT_REAL_GRADLE_SOURCE_EXTRACTED_OK')
          PY
          python3 tools/stage_mnn_arm64.py /tmp/karma-native /tmp/karma-official-android/build
          mkdir -p /tmp/karma-official-android/build/src/main/java/com/mobilei2v/mnn
          cp native/mnnarm64/src/KarmaMnnBridge.java native/mnnarm64/src/KarmaClipEncoder.java native/mnnarm64/src/KarmaSdInference.java /tmp/karma-official-android/build/src/main/java/com/mobilei2v/mnn/
          for lib in libMNN.so libllm.so libkarma_mnn.so; do
            test -s "/tmp/karma-official-android/build/src/main/jniLibs/arm64-v8a/$lib"
          done
          for source in KarmaMnnBridge.java KarmaClipEncoder.java KarmaSdInference.java; do
            test -s "/tmp/karma-official-android/build/src/main/java/com/mobilei2v/mnn/$source"
          done
          echo KARMA_GODOT_REAL_GRADLE_MNN_STAGING_OK
      - name: Set up supported Java 17 for Godot Gradle 8.11.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Gradle recognizes MNN source sets (no APK)
        run: |
          set -euo pipefail
          cd /tmp/karma-official-android/build
          chmod +x gradlew
          cat > /tmp/karma-mnn-source-sets.init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              def matches = gradle.rootProject.allprojects.findAll { p ->
                  p.plugins.hasPlugin('com.android.application') || p.plugins.hasPlugin('com.android.library')
              }
              assert !matches.isEmpty() : 'No Android Gradle module configured'
              def found = false
              matches.each { p ->
                  def android = p.extensions.findByName('android')
                  def main = android?.sourceSets?.findByName('main')
                  if (main == null) return
                  def jniDirs = main.jniLibs.srcDirs
                  def javaDirs = main.java.srcDirs
                  println 'KARMA_GRADLE_JAVA_SOURCE_DIRS ' + p.path + ' ' + javaDirs
                  def libs = ['libMNN.so', 'libllm.so', 'libkarma_mnn.so']
                  def sources = ['KarmaMnnBridge.java', 'KarmaClipEncoder.java', 'KarmaSdInference.java']
                  def jniOk = libs.every { lib -> jniDirs.any { dir -> new File(dir, 'arm64-v8a/' + lib).isFile() } }
                  def javaOk = sources.every { src -> javaDirs.any { dir -> new File(dir, 'com/mobilei2v/mnn/' + src).isFile() } }
                  println "KARMA_GRADLE_MODULE_CHECK " + p.path + " JNI=" + jniOk + " JAVA=" + javaOk
                  if (jniOk && javaOk) found = true
              }
              assert found : 'MNN JNI libraries and Java classes are not both recognized by an Android Gradle module'
              println 'KARMA_MNN_REAL_GRADLE_SOURCESETS_OK'
          }
          GRADLE
          # Godot may configure a nonstandard Java source root. Register the existing
          # staged Java directory explicitly in the Android module for this validation.
          python3 - <<'PY'
          from pathlib import Path
          build = Path('build.gradle')
          text = build.read_text()
          text += "\n// KARMA MNN validation: include existing Java sources\nandroid.sourceSets.main.java.srcDirs += ['src/main/java']\n"
          build.write_text(text)
          PY
          ./gradlew --no-daemon --console=plain --init-script /tmp/karma-mnn-source-sets.init.gradle help
      - name: Publish integration evidence (not APK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: karma-mnn-arm64-android-staging-proof
          path: /tmp/karma-native/*.txt
          retention-days: 7
