name: KARMA ONE - verify MNN ARM64 Android staging (NO APK)
on:
  push:
    branches: [karma/step04-clip-parity-validated-20261119]
    paths:
      - 'tools/stage_mnn_arm64.py'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/verify-mnn-arm64-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stage-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify real APK export pipeline stages native libraries after Gradle extraction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/build-apk.yml').read_text()
          extract = source.index('      - name: Install Android Gradle build template without launching editor')
          stage = source.index('      - name: Stage verified MNN ARM64 JNI libraries in real Android Gradle export')
          signing = source.index('      - name: Preserve debug signing identity for subsequent updates')
          assert extract < stage < signing, 'MNN staging must follow Gradle extraction'
          assert 'python3 tools/stage_mnn_arm64.py /tmp/karma-native-arm64 android/build' in source
          assert 'gh run download 44459460832' in source
          assert 'actions: read' in source
          assert 'cp "native/mnnarm64/src/$source" "android/build/src/main/java/com/mobilei2v/mnn/$source"' in source
          assert 'KARMA_MNN_ANDROID_JAVA_BRIDGE_STAGED_OK' in source
          assert 'KARMA_MNN_APK_NATIVE_AND_JAVA_PACKAGING_OK' in source
          assert 'grep -Fxq "lib/arm64-v8a/$native_lib" apk-entries.txt' in source
          assert "('KarmaMnnBridge', 'KarmaClipEncoder', 'KarmaSdInference')" in source
          print('KARMA_MNN_REAL_EXPORT_STAGE_WIRING_OK')
          PY
      - name: Fetch exact successful ARM64 native artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ericjamesempere-stack/MobileI2V-Xiaomi-'
          mkdir -p /tmp/karma-native
          gh run download 44459460832 --repo "$GITHUB_REPOSITORY" --name karma-mnn-arm64-native-libs --dir /tmp/karma-native
          test -s /tmp/karma-native/libMNN.so
          test -s /tmp/karma-native/libllm.so
          test -s /tmp/karma-native/libkarma_mnn.so
          test -s /tmp/karma-native/SHA256SUMS
          test -s /tmp/karma-native/mnn-upstream-sha.txt
          test -s /tmp/karma-native/mnn-tokenizer-patched-sha256.txt
          grep -Fxq '40ad7e340cdf5cb29fe9d5f1f9eec794adbaef6d' /tmp/karma-native/mnn-upstream-sha.txt
      - name: Verify real AArch64 JNI exports and native dependencies
        run: |
          set -euo pipefail
          readelf -h /tmp/karma-native/libkarma_mnn.so | grep -F 'AArch64'
          readelf -Ws /tmp/karma-native/libkarma_mnn.so > /tmp/karma-mnn-jni-symbols.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          java = Path('native/mnnarm64/src/KarmaMnnBridge.java').read_text()
          cpp = Path('native/mnnarm64/src/karma_mnn_jni.cpp').read_text()
          symbols = Path('/tmp/karma-mnn-jni-symbols.txt').read_text()
          methods = re.findall(r'\\b(?:private|public)\\s+static\\s+native\\s+\\S+\\s+(native\\w+)\\s*\\(', java)
          assert methods, 'No Java native methods detected'
          for method in methods:
              symbol = 'Java_com_mobilei2v_mnn_KarmaMnnBridge_' + method
              assert symbol in cpp, 'JNI source implementation missing: ' + symbol
              assert symbol in symbols, 'ARM64 ELF JNI export missing: ' + symbol
          print('KARMA_MNN_ARM64_JNI_ELF_EXPORTS_OK', len(methods))
          PY
          readelf -d /tmp/karma-native/libkarma_mnn.so | grep NEEDED
          echo KARMA_MNN_ARM64_NATIVE_SYMBOL_CHECK_OK
      - name: Validate Godot Android Gradle layout and stage libraries
        run: |
          set -euo pipefail
          mkdir -p /tmp/karma-android-build
          printf 'plugins { id "com.android.library" }\n' > /tmp/karma-android-build/build.gradle
          python3 tools/stage_mnn_arm64.py /tmp/karma-native /tmp/karma-android-build
          test -s /tmp/karma-android-build/src/main/jniLibs/arm64-v8a/libMNN.so
          test -s /tmp/karma-android-build/src/main/jniLibs/arm64-v8a/libllm.so
          test -s /tmp/karma-android-build/src/main/jniLibs/arm64-v8a/libkarma_mnn.so
          mkdir -p /tmp/karma-android-build/src/main/java/com/mobilei2v/mnn
          cp native/mnnarm64/src/KarmaMnnBridge.java native/mnnarm64/src/KarmaClipEncoder.java native/mnnarm64/src/KarmaSdInference.java /tmp/karma-android-build/src/main/java/com/mobilei2v/mnn/
          ANDROID_JAR="$(find "${ANDROID_HOME:-/opt/android-sdk}" -path '*/platforms/android-*/android.jar' -print | sort -V | tail -n 1)"
          test -s "$ANDROID_JAR"
          mkdir -p /tmp/karma-mnn-java-classes
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/karma-mnn-java-classes /tmp/karma-android-build/src/main/java/com/mobilei2v/mnn/*.java
          test -s /tmp/karma-mnn-java-classes/com/mobilei2v/mnn/KarmaMnnBridge.class
          echo KARMA_MNN_ARM64_ANDROID_STAGING_OK
      - name: Publish integration evidence (not APK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: karma-mnn-arm64-android-staging-proof
          path: /tmp/karma-native/*.txt
          retention-days: 7
