name: Probe KARMA ONE real vision services
on:
  push:
    branches: [karma/reprise-base-stable-20261118]
    paths:
      - tools/probe_vision_services.py
      - .github/workflows/probe-vision-services.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public Gradio capabilities without image uploads
        run: python tools/probe_vision_services.py
      - uses: actions/upload-artifact@v4
        with:
          name: KARMA_VISION_PROVIDER_PROBE
          path: vision_service_probe.json
