name: KARMA ONE - publish verified public SD15 models (NO APK)
on:
  workflow_dispatch:
  push:
    branches: [karma/step04-clip-parity-validated-20261119]
    paths: [".github/workflows/publish-sd15-public-models.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Recover existing converted model artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/karma-models
          gh run download 44534183813 --repo "$GITHUB_REPOSITORY" --name karma-sd15-mnn-models-preserved --dir /tmp/karma-models
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("/tmp/karma-models")
          for name in ["tokenizer.mtok","text_encoder.mnn","unet.mnn","vae_decoder.mnn"]:
              matches=list(root.rglob(name))
              if len(matches)!=1: raise RuntimeError("Missing or ambiguous model file: "+name)
              if matches[0].parent!=root: shutil.copy2(matches[0],root/name)
          for name in ["text_encoder.mnn.weight","unet.mnn.weight","vae_decoder.mnn.weight"]:
              matches=list(root.rglob(name))
              if len(matches)>1: raise RuntimeError("Ambiguous external weight: "+name)
              if matches and matches[0].parent!=root: shutil.copy2(matches[0],root/name)
          PY
          python3 tools/verify_mnn_sd_export.py --model-dir /tmp/karma-models
      - name: Prepare SHA256 catalog of all native model files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/karma-models')
          names=['tokenizer.mtok','text_encoder.mnn','unet.mnn','vae_decoder.mnn']
          names += [n+'.weight' for n in names if n.endswith('.mnn') and (root/(n+'.weight')).is_file()]
          catalog={'format':'karma-sd15-public-v1','files':[]}
          for name in names:
              p=root/name
              assert p.is_file() and p.stat().st_size>1024,name
              assert p.stat().st_size<2_000_000_000,'Release asset too large: '+name
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(4*1024*1024),b''):h.update(b)
              catalog['files'].append({'name':name,'bytes':p.stat().st_size,'sha256':h.hexdigest()})
          (root/'catalog.json').write_text(json.dumps(catalog,indent=2)+'\n')
          print('VERIFIED_PUBLIC_RELEASE_FILES',len(catalog['files']))
          PY
      - name: Publish immutable public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=karma-sd15-mnn-v1
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists: refusing to overwrite published model checksums.'
            exit 1
          fi
          assets=(/tmp/karma-models/catalog.json /tmp/karma-models/tokenizer.mtok /tmp/karma-models/text_encoder.mnn /tmp/karma-models/unet.mnn /tmp/karma-models/vae_decoder.mnn)
          for weight in /tmp/karma-models/*.mnn.weight; do
            if [ -f "$weight" ]; then assets+=("$weight"); fi
          done
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title 'KARMA ONE SD1.5 MNN models v1' --notes 'Public model assets; checksums in catalog.json. Graph inference on Android not yet verified.' --latest=false
