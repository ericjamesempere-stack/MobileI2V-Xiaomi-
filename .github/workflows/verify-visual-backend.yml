name: Verify Visual Backend API

on:
  pull_request:
    paths:
      - 'tools/visual_backend.py'
      - 'tools/test_real_pose.py'
      - 'tests/test_visual_backend_contract.py'
      - '.github/workflows/verify-visual-backend.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight API test dependencies
        run: python -m pip install flask pillow numpy
      - name: Check pose validation script syntax and command line
        run: |
          python -m py_compile tools/test_real_pose.py tools/visual_backend.py
          python tools/test_real_pose.py --help
      - name: Verify HTTP response contracts without downloading model weights
        run: python -m unittest discover -s tests -p 'test_visual_backend_contract.py' -v
