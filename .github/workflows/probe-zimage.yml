name: Probe Z-Image Studio external API
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public Gradio endpoints
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          urls = [
            "https://techfreakworm-z-image-studio.hf.space/gradio_api/openapi.json",
            "https://techfreakworm-z-image-studio.hf.space/config",
            "https://huggingface.co/api/spaces/techfreakworm/z-image-studio",
          ]
          results=[]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"KarmaOne-AvailabilityProbe/1.0"})
              with urllib.request.urlopen(req,timeout=20) as response:
                data=response.read(150000)
                parsed=json.loads(data)
                item={"url":url,"status":response.status,"bytes":len(data)}
                if url.endswith("/config"):
                  item["dependencies"]=[{"api_name":d.get("api_name"),"id":d.get("id")} for d in parsed.get("dependencies",[]) if d.get("api_name")]
                elif url.endswith("openapi.json"):
                  item["paths"]=list(parsed.get("paths",{}))[:40]
                else:
                  item["runtime"]=parsed.get("runtime",{})
                results.append(item)
            except Exception as exc:
              results.append({"url":url,"error":str(exc)[:250]})
          with open("zimage_probe.json","w") as f: json.dump(results,f,indent=2)
          print(json.dumps(results,indent=2))
          PY
      - name: Save probe report
        uses: actions/upload-artifact@v4
        with:
          name: zimage-api-probe
          path: zimage_probe.json
