          # 9. Capture globale des exceptions Android dans MainApplication.cs
          main_app_code = """using System;
using Android.App;
using Android.Runtime;

namespace MobileI2VConsole;

[Application]
public class MainApplication : MauiApplication
{
    public MainApplication(IntPtr handle, JniHandleOwnership ownership)
        : base(handle, ownership)
    {
        AppDomain.CurrentDomain.UnhandledException += (s, e) =>
        {
            var ex = e.ExceptionObject as Exception;
            var msg = ex != null ? $"[CRASH AppDomain] {ex.GetType().FullName}: {ex.Message}" : "[CRASH AppDomain] Exception non disponible";
            DiagnosticLogger.Log(msg);
        };

        AndroidEnvironment.UnhandledExceptionRaiser += (s, e) =>
        {
            var msg = e.Exception != null ? $"[CRASH AndroidEnvironment] {e.Exception.GetType().FullName}: {e.Exception.Message}" : "[CRASH AndroidEnvironment] Exception inconnue";
            DiagnosticLogger.Log(msg);
            e.Handled = true;
        };
    }

    protected override MauiApp CreateMauiApp() => MauiProgram.CreateMauiApp();
}
"""
          (base / 'Platforms' / 'Android' / 'MainApplication.cs').write_text(main_app_code, encoding='utf-8')
          print('[OK] MainApplication.cs configure avec gestionnaires de crash Android.')
          PY

      - name: Generate Diagnostic Signing Keystore
        shell: bash
        run: |
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/source/src/MobileI2VConsole/diagnostic.keystore"
          keytool -genkey -v \
            -keystore "$KEYSTORE_PATH" \
            -alias diagnostic \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass diagnostic123 \
            -keypass diagnostic123 \
            -dname "CN=MobileI2VDiagnostic, OU=Engineering, O=MobileI2V, C=FR"
          cp "$KEYSTORE_PATH" "${GITHUB_WORKSPACE}/diagnostic.keystore"
          echo "[OK] Keystore RSA-2048 genere."

      - name: Build Android ARM64 APK
        shell: bash
        run: |
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/source/src/MobileI2VConsole/diagnostic.keystore"
          dotnet publish source/src/MobileI2VConsole/MobileI2VConsole.csproj \
            -c Release \
            -f net10.0-android \
            -p:RuntimeIdentifier=android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$KEYSTORE_PATH" \
            -p:AndroidSigningStorePass=diagnostic123 \
            -p:AndroidSigningKeyAlias=diagnostic \
            -p:AndroidSigningKeyPass=diagnostic123

      - name: Automated Verification of Generated APK
        shell: bash
        run: |
          set -e
          echo "=== 1. Recherche de l'APK genere ==="
          APK_PATH=$(find source/src/MobileI2VConsole/bin/Release/net10.0-android -name "*Signed.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find source/src/MobileI2VConsole/bin/Release/net10.0-android -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::Aucun APK n'a ete produit par dotnet publish !"
            exit 1
          fi
          echo "APK detecte: $APK_PATH"
          ls -lh "$APK_PATH"

          echo "=== 2. Inspection du contenu interne de l'APK (ZIP) ==="
          python3 - <<'PY'
          import zipfile, sys, glob
          apks = glob.glob("source/src/MobileI2VConsole/bin/Release/net10.0-android/android-arm64/publish/*.apk")
          if not apks:
              sys.exit("Aucun fichier APK trouve pour inspection.")
          apk_path = apks[0]

          with zipfile.ZipFile(apk_path, 'r') as zf:
              names = zf.namelist()
              print(f"Nombre total de fichiers dans l'APK: {len(names)}")
              
              so_files = [n for n in names if n.endswith('.so')]
              print(f"Bibliotheques natives .so ({len(so_files)} fichiers):")
              for so in so_files[:10]:
                  print("  -", so)
              
              fonts = [n for n in names if 'OpenSans' in n]
              print(f"Polices OpenSans trouvees: {fonts}")
              
              dlls = [n for n in names if n.endswith('.dll')]
              print(f"Assemblies .NET integres: {len(dlls)} fichiers DLL")
              
              has_manifest = "AndroidManifest.xml" in names
              print(f"AndroidManifest.xml present: {has_manifest}")
              assert has_manifest, "AndroidManifest.xml manquant dans l'APK"
              
              print("[OK] Verification automatique de l'APK reussie avec succes.")
          PY

          cp "$APK_PATH" MobileI2V-Diagnostic-v6-arm64.apk
          echo "[SUCCES] MobileI2V-Diagnostic-v6-arm64.apk pret pour installation."

      - name: Upload Verified Diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2V-Diagnostic-v6-arm64
          path: MobileI2V-Diagnostic-v6-arm64.apk
          if-no-files-found: error
