extends Control
# V14: consolidated V10 technical base and V13 cleaned artwork.
# V13: built from V10. Cleaned storyboard panels, separated close-up cut; no blending or warping.
# Variable hold times, pose-by-pose inspection and touchscreen scrubbing.
const BG: Color = Color("101923")
const SCENES: Array[String] = ["Le regard", "Il rit", "Clin d'oeil", "Profil", "Danse : 16 poses", "Final : gros plans", "Photo 1", "Photo 2", "Photo 3", "Photo 4", "Squelette 2D (demo)", "Planche validee"]
const SCENE_TIMES: Array[float] = [2.1, 1.8, 1.6, 2.0, 5.8, 2.2, 2.5, 2.5, 2.5, 2.5, 6.0, 6.0]
const FRAME_COUNT: int = 18
const DANCE_COUNT: int = 16
# Relative duration of each original illustrated pose, for anticipation and follow-through.
const HOLD_WEIGHTS: Array[float] = [1.25, 0.72, 0.72, 0.78, 0.75, 0.82, 0.9, 0.8, 1.05, 1.1, 0.75, 0.82, 0.82, 0.88, 1.0, 1.3]
var portraits: Array[Texture2D] = []
var user_photos: Array[Texture2D] = [null, null, null, null]
var photo_picker: FileDialog
var photo_slot: int = 0
var photo_motion: bool = true
var motion_button: Button
var photo_button: Button
var duration_label: Label
var custom_durations: Array[float] = []
var approved_frames: Array[Texture2D] = []
var approved_timeline: Array[int] = []
var approved_duration: float = 6.0
var poses: Array[Texture2D] = []
var intermediate_poses: Array[Texture2D] = []
var smooth_motion: bool = true
var rig: Control
var rig_button: Button
var smooth_button: Button
var current_scene: int = 4
var scene_clock: float = 0.0
var playing: bool = true
var speed: float = 1.0
var pose_index: int = -1
var loop_dance: bool = true
var cinema_mode: bool = false
var seeking: bool = false
var canvas: TextureRect
var title_label: Label
var info_label: Label
var play_button: Button
var speed_button: Button
var loop_button: Button
var timeline: HSlider
# Editable shot list. The original V10/V14 artwork and animation remain unchanged.
var shot_list: Array[int] = [0, 1, 2, 3, 4, 5]
var shot_cursor: int = 4
var edit_mode: bool = false
var editor_panel: PanelContainer
var shots_label: Label
var edit_button: Button
var shot_duration: float = 1.0
const SAVE_PATH: String = "user://mobilei2v_v15.cfg"

func _load_texture(path: String) -> Texture2D:
    # FIX V50: ne jamais planter si un asset binaire manque (archive sans images).
    if ResourceLoader.exists(path):
        var tex: Texture2D = load(path)
        if tex != null:
            return tex
    push_warning("Asset manquant : " + path)
    return null

