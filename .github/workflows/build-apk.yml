name: Build MobileI2V Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: himadriHK/MobileI2VConsole
          path: source

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android
        run: dotnet workload install maui-android

      - name: Restore workloads
        run: dotnet workload restore source/src/MobileI2VConsole/MobileI2VConsole.csproj

      - name: Patch and validate XAML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          base = Path('source/src/MobileI2VConsole')
          views = base / 'Views'
          patched = []
          for file in views.rglob('*.xaml'):
              original = file.read_text(encoding='utf-8')
              updated = original.replace('{StaticResource PageBackgroundColor}', '#1A1A2E')
              if file.name == 'ResultPage.xaml':
                  updated = re.sub(r'\s+IsLooping\s*=\s*"[^"]*"', '', updated)
              if updated != original:
                  file.write_text(updated, encoding='utf-8')
                  patched.append(str(file))
              ET.parse(file)
          colors = base / 'Resources/Styles/Colors.xaml'
          s = colors.read_text(encoding='utf-8')
          if 'x:Key="PageBackgroundColor"' not in s:
              marker = '    <!-- Surface / Background -->'
              if marker not in s:
                  raise SystemExit('Missing expected marker in Colors.xaml')
              s = s.replace(marker, '    <Color x:Key="PageBackgroundColor">#1A1A2E</Color>\n' + marker, 1)
              colors.write_text(s, encoding='utf-8')
          ET.parse(colors)
          for file in base.rglob('*.xaml'):
              ET.parse(file)
          home = (views / 'HomePage.xaml').read_text(encoding='utf-8')
          assert 'BackgroundColor="#1A1A2E"' in home
          assert '{StaticResource PageBackgroundColor}' not in home
          print('Validated XAML; patched:', patched)
          PY

      - name: Build Android ARM64
        run: |
          dotnet publish source/src/MobileI2VConsole/MobileI2VConsole.csproj \
            -c Release \
            -f net10.0-android \
            -p:RuntimeIdentifier=android-arm64 \
            -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2V-Xiaomi-APK
          path: source/**/*.apk
          if-no-files-found: error
