name: Build Android APK KARMA ONE Reprise ARM64

on:
  push:
    branches: [main, karma/storyboard-story-sequence-20261113, karma/v54-approval-safety-20261116, karma/autopilot-v2-20261117, karma/universal-text-entry-v55-20261117, karma/v55-finalisation-20261117, karma/v56-local-engines-20261117, karma/advanced-autonomy-integration-20261118, karma/integration-unified-20261118, karma/step09-agent-wiring-20261118, karma/reprise-base-stable-20261118]
    paths-ignore:
      - '**.md'
      - '.github/workflows/validate-universal-live.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional full SHA; if provided it must match selected branch HEAD"
        required: false
        type: string

permissions:
  contents: read

# Only the newest commit needs a costly Android build. Cancel superseded
# runs on the same branch instead of compiling the H.264 plugin repeatedly.
concurrency:
  group: mobilei2v-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.ref_name != 'karma/step10-consolidation-safe-20261118' &&
      (github.ref_name != 'karma/step11-final-integration-20261118' ||
      (github.event_name == 'workflow_dispatch' && github.run_attempt == '1'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK_NAME: ${{ (github.ref_name == 'karma/step11-final-integration-20261118' || github.ref_name == 'karma/reprise-base-stable-20261118') && 'KARMA_ONE_STEP11_INTEGRATION_ARM64' || (github.ref_name == 'karma/step10-consolidation-safe-20261118' && 'KARMA_ONE_STEP10_CONSOLIDATED_ARM64' || 'KARMA_ONE_STEP09F_AGENT_WIRING_ARM64') }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Guard exact source and artifact identity
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = 'karma/step11-final-integration-20261118' ] || [ "$GITHUB_REF_NAME" = 'karma/reprise-base-stable-20261118' ]; then
            test "$APK_NAME" = 'KARMA_ONE_STEP11_INTEGRATION_ARM64'
          fi
          if [ -n "$REQUESTED_SHA" ]; then
            test "$REQUESTED_SHA" = "$GITHUB_SHA" || { echo "::error::Selected branch SHA differs from requested SHA"; exit 1; }
          fi
          echo "Building $GITHUB_REF_NAME at $GITHUB_SHA as $APK_NAME"


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.5.2 and export templates
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz
          unzip -q Godot_v4.5.2-stable_export_templates.tpz
          template_dir="$HOME/.local/share/godot/export_templates/4.5.2.stable"
          mkdir -p "$template_dir"
          cp -a templates/. "$template_dir/"
          test -s "$template_dir/android_debug.apk"
          test -s "$template_dir/android_release.apk"
          ./Godot_v4.5.2-stable_linux.x86_64 --version

      - name: Build Android H264 MediaCodec plugin
        run: |
          set -euo pipefail
          gradle -p native/mp4exporter assembleDebug testDebugUnitTest --no-daemon
          mkdir -p addons/mp4exporter
          find native/mp4exporter/build/outputs/aar -name '*-debug.aar' -print -quit | xargs -r -I '{}' cp '{}' addons/mp4exporter/mp4exporter.aar
          test -s addons/mp4exporter/mp4exporter.aar
          unzip -p addons/mp4exporter/mp4exporter.aar AndroidManifest.xml >/dev/null
          echo "Native H264 Android AAR compiled"

      - name: Install Android Gradle build template without launching editor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          archive = Path("templates/android_source.zip")
          assert archive.is_file(), f"Missing Android Gradle template: {archive}"
          root = Path("android/build")
          with zipfile.ZipFile(archive) as z:
              entries = [x for x in z.infolist() if not x.is_dir()]
              candidates = [x for x in entries if x.filename.endswith("build.gradle") and not x.filename.endswith("settings.gradle")]
              print("Gradle files:", [x.filename for x in candidates[:15]])
              prefix = ""
              for c in candidates:
                  if c.filename.endswith("build/build.gradle"):
                      prefix = c.filename[:-len("build/build.gradle")]
                      break
              for entry in entries:
                  name = entry.filename
                  if prefix and not name.startswith(prefix): continue
                  rel = name[len(prefix):]
                  if rel.startswith("android/build/"): rel = rel[len("android/build/"):]
                  elif rel.startswith("build/"): rel = rel[len("build/"):]
                  if not rel or rel.startswith("/") or ".." in Path(rel).parts: continue
                  dest = root / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(entry))
          assert (root / "build.gradle").is_file(), "Android Gradle template layout not found"
          wrapper = root / "gradlew"
          assert wrapper.is_file(), "Missing Gradle wrapper"
          wrapper.chmod(wrapper.stat().st_mode | 0o111)
          (root.parent / ".build_version").write_text("4.5.2.stable" + chr(10))
          (root / ".gdignore").write_text("")
          print("Android Gradle template extracted with Godot 4.5.2 version marker")
          PY

      - name: Preserve debug signing identity for subsequent updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mobilei2v-debug-signing-v1

      - name: Prepare Android SDK and debug signing key
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses </dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;23.2.8568313'
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass android -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' -noprompt
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Configure and verify Godot Android export settings
        run: |
          set -euo pipefail
          mkdir -p ci
          cat > ci/configure_android.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
              var settings: EditorSettings = EditorInterface.get_editor_settings()
              if settings == null:
                  push_error("Godot EditorSettings unavailable")
                  quit(1)
                  return
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              settings.set_setting("export/android/debug_keystore", OS.get_environment("HOME").path_join(".android/debug.keystore"))
              settings.set_setting("export/android/debug_keystore_user", "androiddebugkey")
              settings.set_setting("export/android/debug_keystore_pass", "android")
              for key in ["export/android/android_sdk_path", "export/android/java_sdk_path"]:
                  var value: String = str(settings.get_setting(key))
                  if value.is_empty() or not DirAccess.dir_exists_absolute(value):
                      push_error("Invalid Android setting %s: %s" % [key, value])
                      quit(1)
                      return
              var keystore: String = str(settings.get_setting("export/android/debug_keystore"))
              if not FileAccess.file_exists(keystore):
                  push_error("Debug keystore does not exist: " + keystore)
                  quit(1)
                  return
              print("Verified Android SDK, Java, and debug keystore settings")
              quit(0)
          GDSCRIPT
          timeout 45s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --editor --script res://ci/configure_android.gd 2>&1 | tee configure.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call' configure.log; then exit 1; fi

      - name: Import Godot project
        run: |
          set -euo pipefail
          timeout 120s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ConfigFile parse error' import.log; then exit 1; fi

      - name: Verify V58 import lifecycle and persistence
        run: |
          set -euo pipefail
          timeout 60s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_v58_photo_recovery.gd 2>&1 | tee v58-photo.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Assertion failed' v58-photo.log; then exit 1; fi

      - name: Verify V59 ChatGPT handoff and existing review regression
        run: |
          set -euo pipefail
          timeout 60s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_chatgpt_board_bridge.gd 2>&1 | tee v59-chatgpt.log
          grep -q 'CHATGPT_BRIDGE_OK' v59-chatgpt.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Assertion failed' v59-chatgpt.log; then exit 1; fi

      - name: Verify V60 simplified UI and shared-image integration
        run: |
          set -euo pipefail
          timeout 60s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_v60_simplified_receive.gd 2>&1 | tee v60-receive.log
          grep -q 'V60_SIMPLIFIED_RECEIVE_OK' v60-receive.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Assertion failed' v60-receive.log; then exit 1; fi

      - name: Check V55 text-to-image storyboard contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_v55_text_entry_contract.py' -v

      - name: Test AUTOPILOT memory and real-tool supervisor
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_autopilot.py' -v
          timeout 30s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_karma_technical_memory.gd 2>&1 | tee autopilot-memory.log
          grep -q 'AUTOPILOT_TECHNICAL_MEMORY_OK' autopilot-memory.log
          timeout 30s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_autopilot_pipeline_budget.gd 2>&1 | tee autopilot-pipeline.log
          grep -q 'AUTOPILOT_PIPELINE_BUDGET_OK' autopilot-pipeline.log
          timeout 30s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_import_individual_review.gd 2>&1 | tee import-individual-review.log
          grep -q 'IMPORTED_DRAWINGS_INDIVIDUAL_REVIEW_OK' import-individual-review.log
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error|ERROR:' import-individual-review.log; then exit 1; fi
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error|ERROR:' autopilot-pipeline.log; then exit 1; fi
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error|ERROR:' autopilot-memory.log; then exit 1; fi
      - name: Test KARMA ONE intermediate rendering and cache
        run: |
          set -euo pipefail
          timeout 60s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_karma_intermediate_render.gd 2>&1 | tee intermediate-render.log
          grep -q 'V54_INTERMEDIATE_RENDER_CANDIDATES_OK' intermediate-render.log
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error|ERROR:' intermediate-render.log; then exit 1; fi
      - name: Test KARMA ONE intermediate agent contract
        run: |
          set -euo pipefail
          timeout 45s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_karma_intermediate_agent.gd 2>&1 | tee intermediate-agent.log
          grep -q 'V54_INTERMEDIATE_AGENT_CONTRACT_OK' intermediate-agent.log
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error|ERROR:' intermediate-agent.log; then exit 1; fi
      - name: Validate KARMA ONE before building APK
        run: |
          set -euo pipefail
          timeout 120s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/validate_karma_one.gd 2>&1 | tee karma-validation.log
          grep -q 'KARMA ONE: all selected scripts parsed successfully' karma-validation.log
          grep -q 'PASS: missing frames, restore, multi-batch merge' karma-validation.log
          grep -q 'VALID MAIN SCENE' karma-validation.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|INVALID SCRIPT|FAILED:|INVALID MAIN SCENE' karma-validation.log; then exit 1; fi
          echo 'KARMA ONE tests passed; continuing directly to Android APK export.' >> "$GITHUB_STEP_SUMMARY"

      - name: Test disk drawings and aspect-preserving export
        run: |
          set -euo pipefail
          timeout 120s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_disk_drawing_sequence.gd 2>&1 | tee disk-drawings.log
          grep -q 'DISK_DRAWING_SEQUENCE_OK' disk-drawings.log
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error' disk-drawings.log; then exit 1; fi

      - name: Test real image service protocol without GPU calls
        run: |
          set -euo pipefail
          run_protocol_test() {
            local data_dir
            data_dir=$(mktemp -d "$RUNNER_TEMP/karma-protocol.XXXXXX")
            XDG_DATA_HOME="$data_dir" timeout 30s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script "$1"
          }
          run_protocol_test res://tests/test_remote_pose_briefs.gd 2>&1 | tee remote-poses.log
          grep -q 'REMOTE_POSE_BRIEFS_OK' remote-poses.log
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error' remote-poses.log; then exit 1; fi
          run_protocol_test res://tests/test_hf_batch_fallback.gd 2>&1 | tee hf-batch.log
          grep -q 'HF_BATCH_FALLBACK_OK' hf-batch.log
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error' hf-batch.log; then exit 1; fi
          run_protocol_test res://tests/test_detailed_style_reference.gd 2>&1 | tee detailed-style.log
          grep -q 'DETAILED_STYLE_REFERENCE_OK' detailed-style.log
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error' detailed-style.log; then exit 1; fi
          run_protocol_test res://tests/test_hf_studio_generator.gd 2>&1 | tee hf-studio-protocol.log
          grep -q 'HF_STUDIO_PROTOCOL_TESTS_OK' hf-studio-protocol.log
          run_protocol_test res://tests/test_hf_studio_ui.gd 2>&1 | tee hf-studio-ui.log
          grep -q 'HF_STUDIO_UI_EXACT_REFERENCE_PERSISTENCE_OK' hf-studio-ui.log
          run_protocol_test res://tests/test_friendly_studio.gd 2>&1 | tee friendly-studio.log
          grep -q 'FRIENDLY_STUDIO_NAVIGATION_AND_GUARDS_OK' friendly-studio.log
          run_protocol_test res://tests/test_reference_review_pipeline.gd 2>&1 | tee reference-review.log
          grep -q 'REFERENCE_IMPORT_SUBJECT_PROMPT_AND_REVIEW_GATE_OK' reference-review.log
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error|ERROR:' reference-review.log; then exit 1; fi
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error|ERROR:' friendly-studio.log; then exit 1; fi
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error|ERROR:' hf-studio-ui.log; then exit 1; fi
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error' hf-studio-protocol.log; then exit 1; fi

      - name: Test local engines without cloud calls
        timeout-minutes: 4
        run: |
          set -euo pipefail
          GODOT_BIN="$PWD/Godot_v4.5.2-stable_linux.x86_64" python3 tests/test_local_studio_transport.py 2>&1 | tee local-studio.log
          grep -q 'LOCAL_HTTP_NO_CLOUD_COUNTS_OK' local-studio.log
          GODOT_BIN="$PWD/Godot_v4.5.2-stable_linux.x86_64" python3 tests/test_local_engine_probe.py 2>&1 | tee local-engine-probe.log
          grep -q 'LOCAL_ENGINE_PROBE_HTTP_OK' local-engine-probe.log
          timeout 30s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_local_prompt.gd 2>&1 | tee local-prompt.log
          grep -q 'LOCAL_PROMPT_BUDGET_OK' local-prompt.log
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error|ERROR:' local-prompt.log; then exit 1; fi
      - name: Step 12 visual quality regression
        timeout-minutes: 3
        run: |
          set -euo pipefail
          for spec in test_generated_frame_validator.gd test_unified_storyboard_wiring.gd test_reference_review_pipeline.gd; do
            log="step12-${spec%.gd}.log"
            timeout 45s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script "res://tests/$spec" 2>&1 | tee "$log"
            if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error|ERROR:' "$log"; then exit 1; fi
          done

      - name: Test integrated universal Android screen through MP4
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            archive="$RUNNER_TEMP/karma-ffmpeg.tar.xz"
            tools_dir="$RUNNER_TEMP/karma-ffmpeg"
            mkdir -p "$tools_dir"
            curl -fLsS --retry 1 --retry-max-time 55 --max-time 45 -o "$archive" \
              'https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-17-12-40/ffmpeg-n8.1.3-35-gf1acb0a266-linux64-gpl-8.1.tar.xz'
            echo "4f88dca1e0e3079b0e8ba59a74a5bbdb8c89086a1508630616df76a56b0e0e55  $archive" | sha256sum -c -
            tar -xJf "$archive" -C "$tools_dir" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            export PATH="$tools_dir:$PATH"
            echo "$tools_dir" >> "$GITHUB_PATH"
          fi
          command -v ffmpeg
          command -v ffprobe
          KARMA_INTEGRATION_EVIDENCE_DIR="$PWD/build/integration-proof" timeout 90s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_universal_android_integration.gd 2>&1 | tee universal-android-integration.log
          grep -q 'UNIVERSAL_ANDROID_INTEGRATION_OK' universal-android-integration.log
          if grep -Ei 'SCRIPT ERROR|Assertion failed|Parse Error|ERROR:' universal-android-integration.log; then exit 1; fi
      - name: Run the connected agent validation graph on the autonomy branch
        if: github.ref_name == 'karma/advanced-autonomy-integration-20261118'
        run: |
          set -euo pipefail
          # checkout defaults to a single branch. Expose its exact commit to inventory.
          git update-ref refs/remotes/origin/"$GITHUB_REF_NAME" "$GITHUB_SHA"
          command -v ffmpeg
          command -v ffprobe
          mkdir -p "$RUNNER_TEMP/karma-fixture-data"
          export XDG_DATA_HOME="$RUNNER_TEMP/karma-fixture-data"
          python3 autopilot/supervisor.py --godot "$GITHUB_WORKSPACE/Godot_v4.5.2-stable_linux.x86_64" --budget-seconds 180

      - name: Smoke-test KARMA ONE startup before APK export
        run: |
          set -euo pipefail
          timeout 60s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --quit-after 20 2>&1 | tee karma-startup.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:|FATAL:' karma-startup.log; then exit 1; fi
          echo 'PASS: Godot application startup completed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Write explicit Godot 4.5.2 Android export preset values
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('export_presets.cfg')
          text = p.read_text()
          assert '[preset.0.options]' in text and 'platform="Android"' in text
          values = {
              'keystore/debug': str(Path.home() / '.android/debug.keystore'),
              'keystore/debug_user': 'androiddebugkey',
              'keystore/debug_password': 'android',
              'package/show_as_launcher_app': 'true',
              'architectures/arm64-v8a': 'true',
              'architectures/armeabi-v7a': 'false',
              'architectures/x86': 'false',
              'architectures/x86_64': 'false',
              'package/unique_name': 'com.ericjamesempere.mobilei2v',
          }
          for key, value in values.items():
              encoded = f'"{value}"' if key.startswith('keystore/') or key == 'package/unique_name' else value
              pattern = rf'(?m)^{re.escape(key)}=.*$'
              if re.search(pattern, text):
                  text = re.sub(pattern, f'{key}={encoded}', text, count=1)
              else:
                  text = text.rstrip() + f'\n{key}={encoded}\n'
          p.write_text(text)
          print('Resolved export preset:', p.resolve())
          print('Configured explicit debug signing, launcher activity, package ID, and ARM64-only ABI')
          PY
          grep -E '^(keystore/debug|keystore/debug_user|keystore/debug_password|architectures/arm64-v8a|package/unique_name|package/show_as_launcher_app)=' export_presets.cfg

      - name: Export APK ARM64
        run: |
          set -euo pipefail
          mkdir -p build
          timeout 300s ./Godot_v4.5.2-stable_linux.x86_64 --headless --verbose --path . \
            --export-debug Android build/${APK_NAME}.apk 2>&1 | tee export.log
          test -s build/${APK_NAME}.apk
          unzip -t build/${APK_NAME}.apk | tail -2
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/${APK_NAME}.apk | tee signing-check.log
          # Actions caches are branch-scoped. Publish phone updates from this
          # existing release lane, whose cached key signed the delivered V55.
          if [ "$GITHUB_REF_NAME" = 'karma/v55-finalisation-20261117' ]; then
            grep -q 'certificate SHA-256 digest: 5fe844e7ae98d51d5464f1e3a7d58e218aeade4c11b8fe4a1c5ed5e45d9663ef' signing-check.log
          fi
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging build/${APK_NAME}.apk | tee apk-badging.txt
          grep -q "package: name='com.ericjamesempere.mobilei2v'" apk-badging.txt
          version_code=$(sed -n 's#^version/code=\([0-9][0-9]*\)$#\1#p' export_presets.cfg)
          version_name=$(sed -n 's#^version/name="\(.*\)"$#\1#p' export_presets.cfg)
          test -n "$version_code"
          test -n "$version_name"
          grep -Fq "versionCode='$version_code'" apk-badging.txt
          grep -Fq "versionName='$version_name'" apk-badging.txt
          grep -q 'launchable-activity:' apk-badging.txt
          grep -Fxq "native-code: 'arm64-v8a'" apk-badging.txt
          unzip -Z1 "build/${APK_NAME}.apk" > apk-entries.txt
          grep -Fxq 'lib/arm64-v8a/libgodot_android.so' apk-entries.txt
          stat -c 'APK size: %s bytes' build/${APK_NAME}.apk
          sha256sum build/${APK_NAME}.apk

      - name: Verify native MP4 class and Android plugin registration
        run: |
          set -euo pipefail
          APK=build/${APK_NAME}.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "^(package:|launchable-activity:|native-code:)" | tee build/apk-runtime-metadata.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > build/apk-manifest.txt
          grep -q 'org.godotengine.plugin.v2.MP4Exporter' build/apk-manifest.txt
          grep -q 'networkSecurityConfig' build/apk-manifest.txt
          grep -q 'ReferenceShareProvider' build/apk-manifest.txt
          grep -q 'SharedImageReceiverActivity' build/apk-manifest.txt
          grep -q 'android.intent.action.SEND' build/apk-manifest.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" res/xml/karma_network_security.xml > build/apk-local-network.txt
          grep -q '127.0.0.1' build/apk-local-network.txt
          python3 - <<'PY'
          import zipfile
          import os
          with zipfile.ZipFile('build/' + os.environ['APK_NAME'] + '.apk') as z:
              dex = [z.read(n) for n in z.namelist() if n.endswith('.dex')]
              assert any(b'Lcom/mobilei2v/encoder/MP4Exporter;' in data for data in dex), 'MP4 native class absent'
              assert any(b'share_last_export' in data for data in dex), 'MP4 share method absent'
              assert any(b'Lcom/mobilei2v/encoder/ReferenceImageImporter;' in data for data in dex), 'Native reference importer absent'
              assert any(b'pick_reference_image' in data for data in dex), 'Native photo picker absent'
              if os.environ['GITHUB_REF_NAME'] in ('karma/step10-consolidation-safe-20261118', 'karma/step11-final-integration-20261118'):
                  assert any(b'prefer_document_image_picker' in data for data in dex), 'Document picker bridge absent'
              assert any(b'Lcom/mobilei2v/encoder/ReferenceImagePickerActivity;' in data for data in dex), 'Durable receiver absent'
              assert any(b'Lcom/mobilei2v/encoder/SharedImageReceiverActivity;' in data for data in dex), 'Shared image receiver absent'
              assert any(b'peek_shared_image_result' in data for data in dex), 'Shared image bridge absent'
              assert any(b'play_last_export' in data for data in dex), 'MP4 playback entry absent'
              assert any(b'Lcom/mobilei2v/encoder/ReferenceShareProvider;' in data for data in dex), 'Read-only share provider absent'
              assert any(b'share_chatgpt_reference' in data for data in dex), 'ChatGPT share method absent'
              assert any(b'reference_image_import_status' in data for data in dex), 'Photo stage diagnostic absent'
          print('PASS: MP4Exporter DEX class and plugin registration packaged')
          PY
          echo "Native MP4 class and plugin registration verified. Device encoding not tested." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verified APK checksum and build evidence
        run: |
          set -euo pipefail
          sha256sum build/${APK_NAME}.apk | tee build/SHA256SUMS.txt
          {
            echo "## KARMA ONE Android build"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Godot: 4.5.2"
            echo "- KARMA ONE integration tests: passed"
            echo "- Godot headless startup: passed"
            echo "- APK signature, launcher, ARM64 checks: passed"
            echo "- Android device launch and real MP4 encoding: NOT tested by CI"
            echo "- SHA256:"
            cat build/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            build/${{ env.APK_NAME }}.apk
            build/SHA256SUMS.txt
            build/apk-runtime-metadata.txt
            signing-check.log
            apk-badging.txt
            autopilot-memory.log
            autopilot-pipeline.log
            import-individual-review.log
            local-engine-probe.log
            local-prompt.log
            v58-photo.log
            v59-chatgpt.log
            v60-receive.log
            validation/v60/
            validation/v59/
            validation/v58/
            local-studio.log
            universal-android-integration.log
            validation/autopilot-v2/
            validation/v55/
            validation/v56/
            validation/v57/
            build/integration-proof/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobilei2v-build-logs
          path: |
            native/mp4exporter/build/reports/tests/
            native/mp4exporter/build/test-results/
            import.log
            karma-validation.log
            karma-startup.log
            configure.log
            disk-drawings.log
            export.log
            signing-check.log
            autopilot/reports/*.json
            universal-android-integration.log
            apk-badging.txt
            export_presets.cfg
          if-no-files-found: ignore
          retention-days: 14
