    for key in ["hero", "laugh", "wink", "profile"]:
        var texture: Texture2D = _load_texture("res://assets/" + key + ".jpg")
        if texture != null:
            portraits.append(texture)
    for i in range(FRAME_COUNT):
        var texture: Texture2D = _load_texture("res://assets/poses/pose_%02d.jpg" % i)
        if texture != null:
            poses.append(texture)
    for i in range(15):
        var mid: Texture2D = _load_texture("res://assets/poses/mid_%02d.jpg" % i)
        if mid != null:
            intermediate_poses.append(mid)
    var background: ColorRect = ColorRect.new()
    background.color = BG
    background.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
    add_child(background)
    canvas = TextureRect.new()
    canvas.position = Vector2(0, 118)
    canvas.size = Vector2(720, 885)
    canvas.expand_mode = TextureRect.EXPAND_IGNORE_SIZE
    canvas.stretch_mode = TextureRect.STRETCH_KEEP_ASPECT_CENTERED
    canvas.mouse_filter = Control.MOUSE_FILTER_IGNORE
    canvas.pivot_offset = canvas.size * 0.5
    add_child(canvas)
    var header: ColorRect = ColorRect.new()
    header.color = Color("192634")
    header.position = Vector2.ZERO
    header.size = Vector2(720, 118)
    add_child(header)
    title_label = _label(Vector2(20, 12), 28, Color.WHITE)
    info_label = _label(Vector2(20, 68), 18, Color("b5c7d8"))
    var footer: ColorRect = ColorRect.new()
    footer.color = Color("192634")
    footer.position = Vector2(0, 1004)
    footer.size = Vector2(720, 276)
    add_child(footer)
    timeline = HSlider.new()
    timeline.position = Vector2(24, 1024)
    timeline.size = Vector2(672, 40)
    timeline.min_value = 0.0
    timeline.max_value = 1000.0
    timeline.step = 1.0
    timeline.value_changed.connect(_on_seek)
    timeline.drag_started.connect(_on_drag_started)
    timeline.drag_ended.connect(_on_drag_ended)
    add_child(timeline)
    play_button = _button("Pause", Vector2(12, 1080), Vector2(160, 76))
    play_button.pressed.connect(_toggle_pause)
    var back: Button = _button("Pose -", Vector2(185, 1080), Vector2(160, 76))
    back.pressed.connect(_previous_pose)
    var forward: Button = _button("Pose +", Vector2(358, 1080), Vector2(160, 76))
    forward.pressed.connect(_next_pose)
    speed_button = _button("1x", Vector2(531, 1080), Vector2(175, 76))
    speed_button.pressed.connect(_change_speed)
    var replay: Button = _button("Rejouer", Vector2(12, 1173), Vector2(160, 76))
    replay.pressed.connect(_restart)
    var next_scene: Button = _button("Scene +", Vector2(185, 1173), Vector2(160, 76))
    next_scene.pressed.connect(_next_scene)
    var dance: Button = _button("Danse", Vector2(358, 1173), Vector2(160, 76))
    dance.pressed.connect(_go_dance)
    loop_button = _button("Boucle ON", Vector2(531, 1173), Vector2(175, 76))
    loop_button.pressed.connect(_toggle_loop)
    var film_button: Button = _button("Film / Danse", Vector2(12, 950), Vector2(210, 46))
    film_button.pressed.connect(_toggle_film_mode)
    for i in range(SCENE_TIMES.size()):
        custom_durations.append(SCENE_TIMES[i])
    _load_project()
    _load_user_photos()
    _load_approved_board()
    _build_photo_picker()
    _build_editor()
    _build_motion_controls()
    _build_smooth_control()
    rig = Control.new()
    rig.set_script(load("res://scripts/rig_character.gd"))
    rig.position = Vector2(0, 105)
    rig.size = Vector2(720, 900)
    rig.mouse_filter = Control.MOUSE_FILTER_IGNORE
    add_child(rig)
    rig_button = _button("Squelette 2D", Vector2(232, 950), Vector2(235, 46))
    rig_button.pressed.connect(_go_rig)
    var board_button: Button = _button("Planche / Valider", Vector2(473, 950), Vector2(233, 46))
    board_button.pressed.connect(_open_storyboard)
    var guided: Button = _button("Photo > Danse V49", Vector2(232, 900), Vector2(270, 44))
    guided.pressed.connect(_open_guided)
