name: MobileI2V V6 - Android Diagnostic APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android MAUI workload
        run: dotnet workload install maui-android

      - name: Create isolated diagnostic application
        shell: bash
        run: |
          set -euo pipefail
          dotnet new maui -n MobileI2VDiagnostic -o diagnostic
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('diagnostic')
          proj = root / 'MobileI2VDiagnostic.csproj'
          data = proj.read_text(encoding='utf-8')
          data = re.sub(r'<TargetFrameworks?>.*?</TargetFrameworks?>', '<TargetFramework>net10.0-android</TargetFramework>', data, count=1, flags=re.S)
          data = re.sub(r'<ApplicationId>.*?</ApplicationId>', '<ApplicationId>com.mobilei2v.diagnostic.v6</ApplicationId>', data)
          data = re.sub(r'<ApplicationTitle>.*?</ApplicationTitle>', '<ApplicationTitle>MobileI2V Diagnostic V6</ApplicationTitle>', data)
          data = re.sub(r'<ApplicationDisplayVersion>.*?</ApplicationDisplayVersion>', '<ApplicationDisplayVersion>1.6</ApplicationDisplayVersion>', data)
          data = re.sub(r'<ApplicationVersion>.*?</ApplicationVersion>', '<ApplicationVersion>6</ApplicationVersion>', data)
          if '<ApplicationId>' not in data:
              raise RuntimeError('ApplicationId missing from MAUI template')
          proj.write_text(data, encoding='utf-8')
          (root / 'App.xaml.cs').write_text('''using System;
          using System.Runtime.InteropServices;
          using Microsoft.Maui.Controls;
          using Microsoft.Maui.Graphics;

          namespace MobileI2VDiagnostic;

          public partial class App : Application
          {
              public App()
              {
                  InitializeComponent();
              }

              protected override Window CreateWindow(IActivationState? activationState)
              {
                  var status = new Label
                  {
                      Text = "Diagnostic prêt. Appuyez sur Tester.",
                      FontSize = 16,
                      TextColor = Colors.White
                  };
                  var test = new Button { Text = "Tester CPU et stockage" };
                  test.Clicked += (sender, args) =>
                  {
                      try
                      {
                          var path = FileSystem.AppDataDirectory;
                          var arch = RuntimeInformation.ProcessArchitecture;
                          var file = System.IO.Path.Combine(path, "diagnostic-v6.txt");
                          System.IO.File.WriteAllText(file, "MobileI2V V6 diagnostic OK");
                          status.Text = $"TEST RÉUSSI\\nCPU : {arch}\\nStockage : OK\\n{file}";
                      }
                      catch (Exception ex)
                      {
                          status.Text = $"ERREUR : {ex.GetType().Name}\\n{ex.Message}";
                      }
                  };
                  var layout = new VerticalStackLayout
                  {
                      Padding = new Thickness(24),
                      Spacing = 20,
                      Children =
                      {
                          new Label { Text = "MobileI2V - Diagnostic V6", FontSize = 25,
                                      FontAttributes = FontAttributes.Bold, TextColor = Colors.Cyan },
                          new Label { Text = "Application de diagnostic autonome ARM64. Aucun modèle IA chargé.",
                                      TextColor = Colors.White },
                          test,
                          status
                      }
                  };
                  return new Window(new ContentPage
                  {
                      BackgroundColor = Color.FromArgb("#101827"),
                      Content = new ScrollView { Content = layout }
                  });
              }
          }
          ''', encoding='utf-8')
          print('Diagnostic app generated:', proj)
          PY

      - name: Build ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish diagnostic/MobileI2VDiagnostic.csproj \
            -c Release -f net10.0-android \
            -p:RuntimeIdentifier=android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          find diagnostic/bin/Release -type f -name '*.apk' -print
          APK=$(find diagnostic/bin/Release -type f -name '*Signed.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo 'No signed APK found. Inspect build output.' >&2
            exit 1
          fi
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              bad = archive.testzip()
              assert bad is None, f'Corrupt APK entry: {bad}'
              assert 'AndroidManifest.xml' in archive.namelist()
              print('APK ZIP integrity and manifest verified')
          PY
          cp "$APK" MobileI2V-V6-Diagnostic-arm64.apk

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2V-V6-Diagnostic-arm64
          path: MobileI2V-V6-Diagnostic-arm64.apk
          if-no-files-found: error
