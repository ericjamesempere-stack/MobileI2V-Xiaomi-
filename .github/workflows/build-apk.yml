name: Build Android APK (MobileI2V V50)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 (keystore + Godot Android export)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot 4.3 stable
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          ./Godot_v4.3-stable_linux.x86_64 --version

      - name: Install export templates 4.3 stable
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/
          rmdir templates

      - name: Generate debug keystore (zero cost, test only)
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias mobilei2v \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mobilei2v -keypass mobilei2v \
            -dname "CN=MobileI2V, OU=Dev, O=ericjamesempere, L=Paris, C=FR"
          sed -i "s|^package/signed=true|package/signed=true\npackage/keystore/debug=../debug.keystore\npackage/keystore/debug_user=mobilei2v\npackage/keystore/debug_password=mobilei2v|" export_presets.cfg
          grep -n keystore export_presets.cfg

      - name: Import project (headless)
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --import . 2>&1 | tail -30 || true

      - name: Export debug APK ARM64
        run: |
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --export-debug "Android" build/MobileI2V_v50_arm64.apk 2>&1 | tail -60

      - name: Check APK exists
        run: |
          ls -la build/
          file build/*.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2V_v50_arm64_apk
          path: build/*.apk
          if-no-files-found: error