name: Build Android APK (MobileI2V V50 - corrected)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.3 stable
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Install Godot Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Android SDK and debug signing
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$RUNNER_TEMP/mobilei2v.keystore" -alias mobilei2v -keyalg RSA -keysize 2048 -validity 3650 -storepass mobilei2v -keypass mobilei2v -dname 'CN=MobileI2V, O=Development, C=FR'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('export_presets.cfg')
          s=p.read_text()
          needle='package/signed=true'
          assert needle in s, 'Android export preset missing'
          s=s.replace(needle,needle+'\npackage/keystore/debug="'+str(Path(__import__('os').environ['RUNNER_TEMP'])/'mobilei2v.keystore')+'"\npackage/keystore/debug_user="mobilei2v"\npackage/keystore/debug_password="mobilei2v"',1)
          p.write_text(s)
          PY
      - name: Import and validate Godot project
        run: |
          set -euo pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ConfigFile parse error' import.log; then exit 1; fi
      - name: Export debug APK ARM64
        run: |
          set -euo pipefail
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug Android build/MobileI2V_v50_arm64.apk 2>&1 | tee export.log
          test -s build/MobileI2V_v50_arm64.apk
          unzip -t build/MobileI2V_v50_arm64.apk | tail -2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2V_v50_arm64_apk
          path: build/MobileI2V_v50_arm64.apk
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobilei2v-build-logs
          path: |
            import.log
            export.log
          if-no-files-found: ignore
