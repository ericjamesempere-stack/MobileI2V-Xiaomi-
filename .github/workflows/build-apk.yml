
name: Build Android APK MobileI2V V50

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Install Android templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n' > /dev/null
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mobilei2v.keystore" \
            -alias mobilei2v \
            -keyalg RSA -keysize 2048 \
            -validity 3650 \
            -storepass mobilei2v \
            -keypass mobilei2v \
            -dname "CN=MobileI2V, O=Development, C=FR"

          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("export_presets.cfg")
          s = p.read_text()
          s = s.replace('gradle_build/min_sdk="23"\n', '')
          s = s.replace('gradle_build/target_sdk="34"\n', '')
          needle = 'package/signed=true'
          assert needle in s
          signing = (
              needle + '\n'
              + 'package/keystore/debug="'
              + str(Path(os.environ["RUNNER_TEMP"]) / "mobilei2v.keystore")
              + '"\n'
              + 'package/keystore/debug_user="mobilei2v"\n'
              + 'package/keystore/debug_password="mobilei2v"'
          )
          s = s.replace(needle, signing, 1)
          p.write_text(s)
          PY

      - name: Import Godot project
        run: |
          set -euo pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ConfigFile parse error' import.log; then exit 1; fi

      - name: Export Android APK
        run: |
          set -euo pipefail
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug Android build/MobileI2V_v50_arm64.apk 2>&1 | tee export.log
          test -s build/MobileI2V_v50_arm64.apk
          unzip -t build/MobileI2V_v50_arm64.apk | tail -2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2V_v50_arm64_apk
          path: build/MobileI2V_v50_arm64.apk
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobilei2v-build-logs
          path: |
            import.log
            export.log
          if-no-files-found: ignore
