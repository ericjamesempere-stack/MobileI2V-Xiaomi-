name: Verify 2D Storyboard Godot

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'project.godot'
      - '.github/workflows/verify-storyboard.yml'
  workflow_dispatch:

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Import project and parse scripts
        run: |
          ./Godot_v4.5.2-stable_linux.x86_64 --headless --editor --path . --import --quit
      - name: Run movement sequence regression
        run: |
          set -euo pipefail
          for test in test_story_motion_planner.gd test_adaptive_storyboard.gd test_story_director.gd test_character_separator.gd test_continuous_rig.gd test_board_generation_plan.gd test_frame_interpolator.gd test_drawing_quality_gate.gd test_procedural_cartoon_generator.gd; do
            echo "::group::Godot regression: $test"
            timeout --signal=TERM --kill-after=10s 90s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script "res://tests/$test"
            echo "::endgroup::"
          done
