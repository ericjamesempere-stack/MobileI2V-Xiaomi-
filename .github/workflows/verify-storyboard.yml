name: Verify 2D Storyboard Godot

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'project.godot'
      - '.github/workflows/verify-storyboard.yml'
  workflow_dispatch:

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Import project and parse scripts
        run: |
          ./Godot_v4.5.2-stable_linux.x86_64 --headless --editor --path . --import --quit
      - name: Install video encoder for visual smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render articulated visual smoke test
        run: |
          ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_visual_smoke.gd
          FRAMES_DIR="$(find "$HOME/.local/share/godot/app_userdata" -type d -name visual_smoke -print -quit)"
          test -n "$FRAMES_DIR"
          test "$(find "$FRAMES_DIR" -name 'frame_*.png' | wc -l)" -eq 60
          ffmpeg -hide_banner -loglevel error -y -framerate 30 -i "$FRAMES_DIR/frame_%03d.png" -c:v libx264 -pix_fmt yuv420p -movflags +faststart visual_smoke.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 visual_smoke.mp4
      - name: Encode layered IK character preview
        run: |
          FRAMES_DIR="$(find "$HOME/.local/share/godot/app_userdata" -type d -name layered_preview -print -quit)"
          test -n "$FRAMES_DIR"
          test "$(find "$FRAMES_DIR" -name 'frame_*.png' | wc -l)" -eq 60
          ffmpeg -hide_banner -loglevel error -y -framerate 30 -i "$FRAMES_DIR/frame_%03d.png" -c:v libx264 -pix_fmt yuv420p -movflags +faststart layered_ik_preview.mp4
      - name: Upload layered IK preview MP4
        uses: actions/upload-artifact@v4
        with:
          name: mobilei2v-layered-ik-preview-mp4
          path: layered_ik_preview.mp4
          if-no-files-found: error
      - name: Upload visual smoke test MP4
        uses: actions/upload-artifact@v4
        with:
          name: mobilei2v-visual-smoke-mp4
          path: visual_smoke.mp4
          if-no-files-found: error
      - name: Test painted limb warp
        run: |
          ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_painted_limb_warp.gd
      - name: Encode hand-painted limb animation
        run: |
          FRAMES_DIR="$(find "$HOME/.local/share/godot/app_userdata" -type d -name painted_warp -print -quit)"
          test -n "$FRAMES_DIR"
          test "$(find "$FRAMES_DIR" -name 'frame_*.png' | wc -l)" -eq 60
          ffmpeg -hide_banner -loglevel error -y -framerate 30 -i "$FRAMES_DIR/frame_%03d.png" -c:v libx264 -pix_fmt yuv420p -movflags +faststart painted_limb_animation.mp4
      - name: Upload hand-painted animation
        uses: actions/upload-artifact@v4
        with:
          name: mobilei2v-painted-limb-animation
          path: painted_limb_animation.mp4
          if-no-files-found: error
      - name: Test two-bone inverse kinematics
        run: |
          ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_two_bone_ik.gd
      - name: Test test_story_motion_planner.gd
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 75s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_story_motion_planner.gd
      - name: Test test_adaptive_storyboard.gd
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 75s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_adaptive_storyboard.gd
      - name: Test test_story_director.gd
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 75s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_story_director.gd
      - name: Test test_character_separator.gd
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 75s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_character_separator.gd
      - name: Test test_continuous_rig.gd
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 75s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_continuous_rig.gd
      - name: Test test_board_generation_plan.gd
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 75s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_board_generation_plan.gd
      - name: Test test_frame_interpolator.gd
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 75s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_frame_interpolator.gd
      - name: Test test_drawing_quality_gate.gd
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 75s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_drawing_quality_gate.gd
      - name: Test test_procedural_cartoon_generator.gd
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 75s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_procedural_cartoon_generator.gd

      - name: Test visual routing for transformation story
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 75s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_visual_routing.gd
