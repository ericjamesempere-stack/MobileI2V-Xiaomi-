name: KARMA ONE - On-device CPU renderer test (no APK)
on:
  push:
    branches: [karma/step12-consolidation-20261118]
    paths:
      - 'scripts/karma_device_image_engine.gd'
      - 'scripts/local_studio_generator.gd'
      - 'tests/test_device_cpu_image_engine.gd'
      - '.github/workflows/device-cpu-image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-render:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.2
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 -o godot.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Verify native offline image rendering
        run: |
          set -euo pipefail
          ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_device_cpu_image_engine.gd 2>&1 | tee cpu-render.log
          grep -Fq KARMA_DEVICE_CPU_RENDER_OK cpu-render.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Assertion failed|ERROR:' cpu-render.log; then exit 1; fi
