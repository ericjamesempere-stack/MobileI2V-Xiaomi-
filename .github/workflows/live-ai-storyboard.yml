name: KARMA ONE - LIVE AI storyboard evidence (no APK)
on:
  push:
    branches: [karma/step12-consolidation-20261118]
    paths:
      - '.github/workflows/live-ai-storyboard.yml'
      - 'tests/test_live_provider_storyboard.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.2
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 -o godot.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Execute real free-provider image generation and fallback
        timeout-minutes: 15
        run: |
          set -uo pipefail
          timeout 840s ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_live_provider_storyboard.gd 2>&1 | tee live-inference.log
          test -s live-inference.log
          grep -Fq KARMA_LIVE_PROVIDER_REPORT= live-inference.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Assertion failed' live-inference.log; then exit 1; fi
      - name: Upload genuine generated images, contact sheet, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karma-live-ai-evidence-${{ github.sha }}
          path: |
            live-inference.log
            ~/.local/share/godot/app_userdata/**/live-provider-proof/**
          if-no-files-found: warn
          retention-days: 7
