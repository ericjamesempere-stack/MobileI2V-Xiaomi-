name: KARMA ONE Autopilot Evidence Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * *'
permissions:
  contents: read
  actions: read
jobs:
  evidence-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit V53 workflow evidence on one SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KARMA_TARGET_BRANCH: karma/storyboard-story-sequence-20261113
        run: python3 autopilot/audit.py
      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karma-autopilot-evidence
          path: autopilot/reports/latest.json
          if-no-files-found: warn
          retention-days: 30
