name: Verify AI Redraw API
on:
  push:
    branches: [karma/storyboard-story-sequence-20261113]
    paths:
      - 'ai_redraw/**'
      - 'scripts/ai_redraw_client.gd'
      - '.github/workflows/verify-ai-redraw-api.yml'
  workflow_dispatch:
jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r ai_redraw/requirements-api.txt
      - name: Install ffmpeg\n        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg\n      - run: python -m pytest -q ai_redraw/test_server.py ai_redraw/test_video.py ai_redraw/test_create_video.py ai_redraw/test_animate_anything.py
