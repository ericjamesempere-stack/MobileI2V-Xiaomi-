name: Inspect Z-Image ControlNet API schema
on:
  push:
    branches: [rebuild/cartoon-studio-20261114]
    paths: ['.github/workflows/inspect-zimage-schema.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and extract public ControlNet schema
        run: |
          python - <<'PY'
          import json,urllib.request
          url="https://techfreakworm-z-image-studio.hf.space/gradio_api/openapi.json"
          req=urllib.request.Request(url,headers={"User-Agent":"KarmaOne-SchemaInspector/1.0"})
          with urllib.request.urlopen(req,timeout=25) as resp:
            api=json.load(resp)
          paths=api.get("paths",{})
          selected={k:v for k,v in paths.items() if "controlnet" in k.lower() or "t2i_generate" in k.lower()}
          result={"source":url,"paths":selected,"schemas":api.get("components",{}).get("schemas",{})}
          with open("zimage_schema.json","w") as f:json.dump(result,f,indent=2)
          for path,methods in selected.items():
            print("ENDPOINT",path)
            for method,spec in methods.items():
              print("METHOD",method,"OPERATION",spec.get("operationId"))
              print("REQUEST",json.dumps(spec.get("requestBody",{}))[:8000])
          print("Schema count",len(result["schemas"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zimage-controlnet-schema
          path: zimage_schema.json
